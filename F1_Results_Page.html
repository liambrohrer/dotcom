
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Formula 1 Race Predictions</title>

  <style>
    :root {
      --color-ink: #1f2933;
      --color-muted: #52616f;
      --color-accent: #1a5f7a;
      --color-accent-light: #57a6c9;
      --color-bg: #abd0f5;
      --color-surface: #ffffff;
      --color-border: #e1e6eb;
      --radius: 12px;
      --shadow-soft: 0 6px 20px rgba(31, 41, 51, 0.08);
      --shadow-lift: 0 10px 30px rgba(31, 41, 51, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--color-ink);
      background: linear-gradient(180deg, #f5f8fb 0%, var(--color-accent) 100%);
      padding: 56px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .main-container {
      background: var(--color-surface);
      max-width: 1000px;
      margin: auto;
      padding: 48px 56px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--color-border);
    }

    h1, h2, h3, h4 {
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.01em;
      margin-top: 1.6em;
      margin-bottom: 0.5em;
    }

    h1 {
      font-size: 2.25em;
      color: var(--color-accent);
      margin-top: 0;
      padding-bottom: 0.4em;
      border-bottom: 2px solid var(--color-accent-light);
    }

    h2 {
      font-size: 1.2em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-accent);
      padding-bottom: 0.2em;
      border-bottom: 1px solid var(--color-border);
    }

    h3 {
      font-size: 1.05em;
      color: var(--color-ink);
      margin-top: 0;
    }

    p {
      color: var(--color-muted);
      margin-bottom: 0.8em;
    }

    ul, ol {
      color: var(--color-muted);
      margin: 0.5em 0 1em 1.4em;
    }

    li {
      margin-bottom: 0.3em;
    }

    a:link, a:visited {
      color: var(--color-accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    a:hover {
      color: var(--color-accent-light);
      border-bottom-color: var(--color-accent-light);
    }

    pre {
      background: #f4f8fa;
      border-left: 4px solid var(--color-accent);
      border-radius: 0 6px 6px 0;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }

    code {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 0.9em;
      background: #eef4f6;
      color: var(--color-accent);
      padding: 2px 6px;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      margin: 1em 0;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    th, td {
      border: 1px solid var(--color-border);
      padding: 10px 12px;
    }

    th {
      background-color: var(--color-accent);
      color: white;
      text-align: left;
      font-weight: 600;
    }

    tr:nth-child(even) td {
      background-color: #f7fafc;
    }

    hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2.2em 0;
    }

    /* Race information */

    .subtitle {
      margin-top: 1em;
    }

    .race-info {
      background: #f4f8fa;
      border-left: 4px solid var(--color-accent-light);
      padding: 14px 18px;
      margin: 1em 0;
      border-radius: 0 6px 6px 0;
    }

    .race-info p {
      margin: 0.2em 0;
    }

    #last-updated {
      font-size: 0.85em;
      margin-top: 1.2em;
    }

    /* Side-by-side comparison */

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 1.5em;
    }

    .comparison-column {
      min-width: 0;
    }

    .comparison-column h3 {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    .position {
      font-weight: 700;
      color: var(--color-accent);
      text-align: center;
    }

    .prediction-table {
      margin-top: 1em;
      font-size: 0.9em;
    }

    .prediction-table td:first-child,
    .prediction-table th:first-child {
      text-align: center;
      width: 75px;
    }

    .error-message {
      background: #fff1f0;
      color: #a12622;
      border-left: 4px solid #c0392b;
      padding: 14px 18px;
      margin-top: 1em;
      border-radius: 0 6px 6px 0;
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 12px;
      }

      .main-container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.75em;
      }

      .comparison-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      table {
        font-size: 0.85em;
      }

      th, td {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="main-container">

    <h1>Formula 1 Race Predictions</h1>

    <p class="subtitle">
      Machine learning predictions for the Formula 1 season.
    </p>

    <div id="loading">Loading race data...</div>
    <div id="error" class="error-message" hidden></div>

    <div id="race-content" hidden>

      <p id="last-updated"></p>

      <!-- Upcoming race -->

      <section>
        <h2>Upcoming Race Predictions</h2>

        <div id="upcoming-race-info"></div>
        <div id="upcoming-predictions"></div>
      </section>

      <hr>

      <!-- Latest race comparison -->

      <section>
        <h2>Latest Race</h2>

        <div id="latest-race-info"></div>

        <div class="comparison-grid">

          <div class="comparison-column">
            <h3>Predictions</h3>
            <div id="latest-predictions"></div>
          </div>

          <div class="comparison-column">
            <h3>Actual Results</h3>
            <div id="actual-results"></div>
          </div>

        </div>
      </section>

    </div>
  </div>


  <script>

    
    // GitHub location of the F1 predictions JSON file

    const DATA_URL =
      "https://raw.githubusercontent.com/liambrohrer/F1_Predictions/main/public/f1_predictions.json";


    // Capitalise the first letter of each word

    function capitaliseName(name) {

      if (!name) return "Unknown";

      return String(name)
        .replace(/[_-]/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }


    // Get the driver's full name

    function getDriverName(driver) {

      // Check for separate first and last name fields
      const firstName =
        driver.forename ||
        driver.givenName ||
        driver.driver_forename ||
        driver.first_name ||
        "";

      const lastName =
        driver.surname ||
        driver.familyName ||
        driver.driver_surname ||
        driver.last_name ||
        "";

      if (firstName || lastName) {
        return capitaliseName(
          `${firstName} ${lastName}`.trim()
        );
      }

      // Fall back to an existing full-name field
      return capitaliseName(
        driver.driver_name ||
        driver.full_name ||
        driver.driverId
      );
    }


    // Get constructor name

    function getConstructorName(driver) {

      return capitaliseName(
        driver.constructor_name ||
        driver.constructorId
      );
    }


    // Create a consistent driver identifier for matching records

    function getDriverKey(driver) {

      if (driver.driverId) {
        return String(driver.driverId).toLowerCase();
      }

      if (driver.driverRef) {
        return String(driver.driverRef).toLowerCase();
      }

      return getDriverName(driver).toLowerCase();
    }


    // Load the F1 predictions JSON file

    async function loadF1Predictions() {

      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const content = document.getElementById("race-content");

      try {

        // Fetch the latest JSON file

        const response = await fetch(
          `${DATA_URL}?t=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`Unable to load predictions (${response.status})`);
        }

        const data = await response.json();

        // Display last updated timestamp

        if (data.last_updated) {

          const updated = new Date(data.last_updated);

          document.getElementById("last-updated").textContent =
            `Last updated: ${updated.toLocaleString()}`;
        }

        // Upcoming race

        if (data.upcoming_race) {

          displayRaceInfo(
            "upcoming-race-info",
            data.upcoming_race
          );

          displayPredictions(
            "upcoming-predictions",
            data.upcoming_race.predictions
          );

        } else {

          document.getElementById("upcoming-race-info").textContent =
            "No upcoming race information available.";
        }

        // Latest race

        if (data.latest_race) {

          displayRaceInfo(
            "latest-race-info",
            data.latest_race
          );

          // Display predictions and actual results
          // using the same driver order

          displayLatestRaceComparison(
            data.latest_race.predictions,
            data.latest_race.actual_results
          );
        }

        loading.hidden = true;
        content.hidden = false;

      } catch (err) {

        loading.hidden = true;
        error.hidden = false;

        error.textContent =
          `Error loading F1 data: ${err.message}`;
      }
    }


    // Display race information

    function displayRaceInfo(elementId, race) {

      const container = document.getElementById(elementId);

      const name = capitaliseName(
        race.race_name ||
        race.raceName ||
        "Race information unavailable"
      );

      const round = race.round
        ? `Round ${race.round}`
        : "";

      const date = race.date
        ? new Date(race.date).toLocaleDateString()
        : "";

      const info = document.createElement("div");
      info.className = "race-info";

      const nameElement = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = name;
      nameElement.appendChild(strong);

      const detailsElement = document.createElement("p");

      detailsElement.textContent =
        [round, date].filter(Boolean).join(" | ");

      info.append(nameElement, detailsElement);
      container.replaceChildren(info);
    }


    // Sort predictions by predicted rank

    function sortPredictions(predictions) {

      return [...(predictions || [])].sort((a, b) =>
        Number(a.predicted_rank ?? 999) -
        Number(b.predicted_rank ?? 999)
      );
    }


    // Create a prediction table

    function createPredictionTable(predictions) {

      const table = document.createElement("table");
      table.className = "prediction-table";

      table.innerHTML = `
        <thead>
          <tr>
            <th>Rank</th>
            <th>Driver</th>
            <th>Constructor</th>
          </tr>
        </thead>
      `;

      const tbody = document.createElement("tbody");

      predictions.forEach(driver => {

        const row = document.createElement("tr");

        const rank = document.createElement("td");
        rank.className = "position";
        rank.textContent = driver.predicted_rank ?? "—";

        const driverName = document.createElement("td");
        driverName.textContent = getDriverName(driver);

        const constructor = document.createElement("td");
        constructor.textContent = getConstructorName(driver);

        row.append(rank, driverName, constructor);
        tbody.appendChild(row);
      });

      table.appendChild(tbody);

      return table;
    }


    // Display upcoming race predictions

    function displayPredictions(elementId, predictions) {

      const container = document.getElementById(elementId);

      if (!predictions || predictions.length === 0) {
        container.textContent = "No predictions available.";
        return;
      }

      const sorted = sortPredictions(predictions);

      container.replaceChildren(
        createPredictionTable(sorted)
      );
    }


    // Display latest race predictions and actual results
    // in matching driver order

    function displayLatestRaceComparison(predictions, results) {

      const predictionContainer =
        document.getElementById("latest-predictions");

      const resultsContainer =
        document.getElementById("actual-results");

      if (!predictions || predictions.length === 0) {
        predictionContainer.textContent = "No predictions available.";
        resultsContainer.textContent = "No actual results available.";
        return;
      }

      if (!results || results.length === 0) {
        displayPredictions("latest-predictions", predictions);
        resultsContainer.textContent = "No actual results available.";
        return;
      }

      // Sort predictions by predicted rank

      const sortedPredictions = sortPredictions(predictions);

      // Match actual results to predicted driver order

      const actualByDriver = new Map(
        results.map(driver => [
          getDriverKey(driver),
          driver
        ])
      );

      const orderedResults = [];

      sortedPredictions.forEach(driver => {

        const actualResult = actualByDriver.get(
          getDriverKey(driver)
        );

        if (actualResult) {
          orderedResults.push(actualResult);
          actualByDriver.delete(getDriverKey(driver));
        } else {
          orderedResults.push(null);
        }
      });

      // Append any drivers not found in the predictions

      const remainingResults = [...actualByDriver.values()]
        .sort((a, b) =>
          Number(a.positionOrder ?? 999) -
          Number(b.positionOrder ?? 999)
        );

      orderedResults.push(...remainingResults);

      // Build predictions table

      const predictionTable = document.createElement("table");
      predictionTable.className = "prediction-table";

      predictionTable.innerHTML = `
        <thead>
          <tr>
            <th>Rank</th>
            <th>Driver</th>
            <th>Constructor</th>
          </tr>
        </thead>
      `;

      const predictionBody = document.createElement("tbody");

      sortedPredictions.forEach(driver => {

        const row = document.createElement("tr");

        const rank = document.createElement("td");
        rank.className = "position";
        rank.textContent = driver.predicted_rank ?? "—";

        const driverName = document.createElement("td");
        driverName.textContent = getDriverName(driver);

        const constructor = document.createElement("td");
        constructor.textContent = getConstructorName(driver);

        row.append(rank, driverName, constructor);
        predictionBody.appendChild(row);
      });

      predictionTable.appendChild(predictionBody);


      // Build actual results table in the same order

      const resultsTable = document.createElement("table");
      resultsTable.className = "prediction-table";

      resultsTable.innerHTML = `
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Driver</th>
            <th>Constructor</th>
          </tr>
        </thead>
      `;

      const resultsBody = document.createElement("tbody");

      orderedResults.forEach(driver => {

        const row = document.createElement("tr");

        if (driver) {

          const position = document.createElement("td");
          position.className = "position";
          position.textContent = driver.positionOrder ?? "—";

          const driverName = document.createElement("td");
          driverName.textContent = getDriverName(driver);

          const constructor = document.createElement("td");
          constructor.textContent = getConstructorName(driver);

          row.append(position, driverName, constructor);

        } else {

          // No matching actual result

          const position = document.createElement("td");
          position.textContent = "—";

          const driverName = document.createElement("td");
          driverName.textContent = "No result";

          const constructor = document.createElement("td");
          constructor.textContent = "—";

          row.append(position, driverName, constructor);
        }

        resultsBody.appendChild(row);
      });

      resultsTable.appendChild(resultsBody);


      // Display both tables

      predictionContainer.replaceChildren(predictionTable);
      resultsContainer.replaceChildren(resultsTable);
    }


    // Load data when the page opens

    loadF1Predictions();

</script>

</body>
</html>
