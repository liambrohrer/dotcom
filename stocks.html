<style>
      :root {
        --color-ink: #1f2933;
        --color-muted: #52616f;
        --color-accent: #1a5f7a;
        --color-accent-light: #57a6c9;
        --color-bg: #abd0f5;
        --color-surface: #ffffff;
        --color-border: #e1e6eb;
        --radius: 12px;
        --shadow-soft: 0 6px 20px rgba(31, 41, 51, 0.08);
        --shadow-lift: 0 10px 30px rgba(31, 41, 51, 0.12);
      }
  
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
  
      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        color: var(--color-ink);
        background: linear-gradient(180deg, #f5f8fb 0%, var(--color-accent) 100%);
        padding: 56px 20px;
        -webkit-font-smoothing: antialiased;
      }
  
      .main-container {
        background: var(--color-surface);
        max-width: 840px;
        margin: auto;
        padding: 48px 56px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-soft);
        border: 1px solid var(--color-border);
      }
  
      h1, h2, h3, h4 {
        font-weight: 700;
        color: var(--color-ink);
        letter-spacing: -0.01em;
        margin-top: 1.6em;
        margin-bottom: 0.5em;
      }
  
      h1 {
        font-size: 2.25em;
        color: var(--color-accent);
        margin-top: 0;
        padding-bottom: 0.4em;
        border-bottom: 2px solid var(--color-accent-light);
      }
  
      h2 {
        font-size: 1.2em;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-accent);
        padding-bottom: 0.2em;
        border-bottom: 1px solid var(--color-border);
      }
  
      h3 {
        font-size: 1.15em;
        color: var(--color-ink);
      }
  
      p {
        color: var(--color-muted);
        margin-bottom: 0.8em;
      }
  
      ul, ol {
        color: var(--color-muted);
        margin: 0.5em 0 1em 1.4em;
      }
  
      li {
        margin-bottom: 0.3em;
      }
  
      a:link, a:visited {
        color: var(--color-accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
  
      a:hover {
        color: var(--color-accent-light);
        border-bottom-color: var(--color-accent-light);
      }
  
      pre {
        background: #f4f8fa;
        border-left: 4px solid var(--color-accent);
        border-radius: 0 6px 6px 0;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 1em 0;
      }
  
      code {
        font-family: "Fira Code", "Courier New", monospace;
        font-size: 0.9em;
        background: #eef4f6;
        color: var(--color-accent);
        padding: 2px 6px;
        border-radius: 4px;
      }
  
      table {
        border-collapse: collapse;
        margin: 1.2em 0;
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow-soft);
      }
  
      th, td {
        border: 1px solid var(--color-border);
        padding: 10px 14px;
      }
  
      th {
        background-color: var(--color-accent);
        color: white;
        text-align: left;
        font-weight: 600;
      }
  
      tr:nth-child(even) td {
        background-color: #f7fafc;
      }
  
      img {
        display: block;
        margin: 1.2em auto;
        max-width: 100%;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lift);
      }
  
      hr {
        border: none;
        border-top: 1px solid var(--color-border);
        margin: 2.2em 0;
      }
  
      @media (max-width: 600px) {
        body {
          padding: 24px 12px;
        }
        .main-container {
          padding: 28px 24px;
        }
        h1 {
          font-size: 1.75em;
        }
      }
</style>

<div id="stock-results">Loading stock data…</div>

<script>
  const dataUrl =
    "https://raw.githubusercontent.com/liambrohrer/stock_app/main/latest_stock_data.json";

  async function showStockData() {
    const container = document.getElementById("stock-results");

    try {
      const response = await fetch(`${dataUrl}?t=${Date.now()}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const stocks = await response.json();

      container.innerHTML = stocks.map(stock => `
        <section class="stock-card">
          <h2>${stock.Stock} (${stock.Symbol})</h2>
          <p class="stock-date">Date: ${stock.Date}</p>
          <p>Close: ${stock.close ?? "Unavailable"}</p>
          <p>Open: ${stock.open ?? "Unavailable"}</p>
          <p>High: ${stock.high ?? "Unavailable"}</p>
          <p>Low: ${stock.low ?? "Unavailable"}</p>
          <p>Volume: ${stock.volume ?? "Unavailable"}</p>
        </section>
      `).join("");
    } catch (error) {
      container.textContent = "Could not load the latest stock data.";
      console.error(error);
    }
  }

  showStockData();
</script>
